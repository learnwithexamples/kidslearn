<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Academy - KidsLearn</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="ca.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css" integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" integrity="sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
    <script defer src="ca-core.js"></script>
    <script defer src="ca-lesson.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="ca-title">Challenge Academy</h1>
            <p class="subtitle" id="ca-subtitle">Loading lesson…</p>
            <a href="index.html" class="back-link">← Back to Challenge Academy</a>
        </header>

        <div class="ca-panel">
            <div class="ca-nav" id="ca-nav"></div>
        </div>

        <div class="ca-tabs" id="ca-tabs">
            <button class="ca-tab active" data-tab="tutorial">📚 Tutorial</button>
            <button class="ca-tab" data-tab="examples">✏️ Examples</button>
            <button class="ca-tab" data-tab="practice">🎯 Practice</button>
            <button class="ca-tab" data-tab="assignment">📄 Assignment</button>
        </div>

        <div class="ca-panel" id="panel-tutorial"></div>
        <div class="ca-panel ca-hidden" id="panel-examples"></div>
        <div class="ca-panel ca-hidden" id="panel-practice"></div>
        <div class="ca-panel ca-hidden" id="panel-assignment"></div>

        <footer>
            <p>Think hard, check twice! 🏆</p>
        </footer>
    </div>
</body>
</html>
